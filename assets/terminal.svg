<text x="24" y="66" fill="#7fc492">$ <tspan fill="#f3f0e8">echo-cli --help</tspan></text>
<text x="24" y="86" fill="#d8d3c8" xml:space="preserve">Usage: echo [options] [command]</text>
<text x="24" y="106" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="126" fill="#d8d3c8" xml:space="preserve">Rate-limiting / caching domain-expert employee — correct, tested, costed</text>
<text x="24" y="146" fill="#d8d3c8" xml:space="preserve">limiters &amp; caches.</text>
<text x="24" y="166" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="186" fill="#d8d3c8" xml:space="preserve">Options:</text>
<text x="24" y="206" fill="#d8d3c8" xml:space="preserve">  -V, --version                      output the version number</text>
<text x="24" y="226" fill="#d8d3c8" xml:space="preserve">  -h, --help                         display help for command</text>
<text x="24" y="246" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="266" fill="#d8d3c8" xml:space="preserve">Commands:</text>
<text x="24" y="286" fill="#d8d3c8" xml:space="preserve">  brain [options] &lt;question&gt;         BM25 query over brain/ — the queryable</text>
<text x="24" y="306" fill="#d8d3c8" xml:space="preserve">                                     memory layer (cited</text>
<text x="24" y="326" fill="#d8d3c8" xml:space="preserve">                                     OPINIONS/PITFALLS/SCENARIOS rows)</text>
<text x="24" y="346" fill="#d8d3c8" xml:space="preserve">  design [options] &lt;endpoint&gt;        route a request to the right sub-tools</text>
<text x="24" y="366" fill="#d8d3c8" xml:space="preserve">                                     (limiter/idempotency/cache/stampede) and</text>
<text x="24" y="386" fill="#d8d3c8" xml:space="preserve">                                     chain them (C8)</text>
<text x="24" y="406" fill="#d8d3c8" xml:space="preserve">  audit [options] &lt;path&gt;             scan app/api/** for a source-of-truth Map</text>
<text x="24" y="426" fill="#d8d3c8" xml:space="preserve">                                     (BUG, exit!=0) vs ephemeralCache Map (OK)</text>
<text x="24" y="446" fill="#d8d3c8" xml:space="preserve">                                     — the turbo seam</text>
<text x="24" y="466" fill="#d8d3c8" xml:space="preserve">  limiter [options] &lt;endpoint-kind&gt;  emit a correct limiter:</text>
<text x="24" y="486" fill="#d8d3c8" xml:space="preserve">                                     store+algo+identity-key+atomic+concurrency-cap+fail-mode</text>
<text x="24" y="506" fill="#d8d3c8" xml:space="preserve">  cache [options] &lt;pattern&gt;          emit a correct cache: SWR +</text>
<text x="24" y="526" fill="#d8d3c8" xml:space="preserve">                                     always-TTL+jitter + per-tenant key +</text>
<text x="24" y="546" fill="#d8d3c8" xml:space="preserve">                                     invalidation</text>
<text x="24" y="566" fill="#d8d3c8" xml:space="preserve">  idempotency [options] &lt;endpoint&gt;   emit the Stripe pattern: atomic SET NX +</text>
<text x="24" y="586" fill="#d8d3c8" xml:space="preserve">…</text>
